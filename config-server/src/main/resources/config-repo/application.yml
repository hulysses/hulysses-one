spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # Academic first boot; validate can be selected externally.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
