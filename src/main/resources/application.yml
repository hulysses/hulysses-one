# Configuração versionada. application.properties local pode sobrescrever o datasource.
spring:
  application:
    name: hulysses-one
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hulysses_one}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
