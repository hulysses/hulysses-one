spring.datasource.url=jdbc:h2:mem:hulysses_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.cloud.config.enabled=false
services.business-partner.url=${BUSINESS_PARTNER_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.business-partner-service.connectTimeout=2000
spring.cloud.openfeign.client.config.business-partner-service.readTimeout=5000
