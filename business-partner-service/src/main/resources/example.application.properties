spring.application.name=business-partner-service
spring.datasource.url=${PARTNER_DB_URL:jdbc:postgresql://localhost:5432/hulysses_one}
spring.datasource.username=${PARTNER_DB_USERNAME:postgres}
spring.datasource.password=${PARTNER_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${PARTNER_DB_SCHEMA:business_partner_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
server.port=${PARTNER_SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
